name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `with: version` here on purpose. The action reads `packageManager` from the root
      # package.json (`pnpm@11.1.1`), and when both are given it refuses to run at all:
      # "Multiple versions of pnpm specified". The field is the one that stays, because it is also
      # what corepack and CONTRIBUTING.md pin a developer's local pnpm to.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The three source instruments: module reachability, exported functions nothing calls, and
      # channels emitted or listened for with no counterpart. They are stdlib Python over the source
      # tree, and until this step existed they ran only when someone remembered — which is how the
      # review found three unreachable-code instances *with* them and later found the repository had
      # no reading of them at all. `scripts/gate.sh` runs the same three locally.
      #
      # All three can fail, each on a finding that has a clean state: `check-reachability` on a
      # specifier that resolves to nothing, `check-channels` on a channel with no counterpart, and
      # `check-dead-exports` on a control that makes the sweep blind or on the count rising above the
      # ceiling recorded in that file (`CEILING`, 89 — a ratchet like the renderer's `--max-warnings`,
      # not a demand for an empty list, since most of that list is the legitimate "exported so the
      # spec can reach it" idiom).
      - run: |
          python3 scripts/check-reachability.py
          python3 scripts/check-dead-exports.py
          python3 scripts/check-channels.py
      # The suites that test this repository's own shell scripts. Like the instruments above, they
      # existed and nothing invoked them — not this workflow, not `scripts/gate.sh` — so any could
      # have rotted to a permanent failure with every job green. `scripts/gate.sh` runs the same three
      # locally.
      #
      # `package-linux.test.sh` needs a real `rpm` on the machine: it mocks `rpm` with a command that
      # only exits 0, and asserts that `scripts/package-linux.sh` rejects that decoy and pins the real
      # tool (`RPM version N`) instead — the case the packager turns into "no working RPM tool". Whether
      # the runner image already ships it was not verifiable from this repository, so the dependency is
      # declared rather than assumed: installing a package that is already present is a no-op, and the
      # suite fails for a readable reason either way. `boot-probe.test.sh` needs only Node, since it
      # mocks the X server, the session bus and `pkill` itself.
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: |
          bash scripts/boot-probe.test.sh
          bash scripts/package-linux.test.sh
          bash scripts/package-portable.test.sh
      # The WebKit measurement harness's own tests. Its probes need the real engine and stay out of
      # CI, but these two files are pure logic — crop arithmetic and verdict rules — under `node --test`,
      # which no vitest project and no Playwright pattern collects.
      - run: pnpm --filter @nekowite/desktop test:webkit-harness
      - run: pnpm test
      # The perf harness is a separate vitest project, so `pnpm test` never
      # reached it — and it sat broken for two stages because nothing ran it.
      # It asserts the budgets recorded in docs/PERF.md, so it is a gate.
      - run: pnpm perf
      - run: pnpm --filter @nekowite/desktop build
      - run: pnpm --filter @nekowite/desktop check:export-css
      - run: pnpm --filter @nekowite/desktop exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: cargo build
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked
      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all --check
